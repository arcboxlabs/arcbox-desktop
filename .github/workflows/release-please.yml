# Merging the release PR cuts the tag and opens a *draft* GitHub release
# (release-please-config.json sets `draft` + `force-tag-creation`). The tag push
# starts Release DMG, which attaches the signed DMG and publishes that draft.
# A failed build therefore leaves a draft nobody can download by accident,
# instead of an empty release at the top of the releases page.
name: Release Please

on:
  push:
    branches:
      - master

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}

      - uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ steps.app-token.outputs.token }}
