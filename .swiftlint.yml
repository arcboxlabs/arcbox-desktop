included:
  - ArcBox
  - ArcBoxTests
  - ArcBoxUITests
  - Packages

excluded:
  - Packages/*/Sources/*/Generated
  - Packages/*/.build
  - .build
  - .claude

disabled_rules:
  # SwiftFormat places braces and closure parameters using a different multiline style.
  - opening_brace
  - closure_parameter_position
  # Conflicts with Swift package manifests and SwiftFormat's trailing comma behavior.
  - trailing_comma

opt_in_rules:
  - empty_count
  - closure_spacing
  - contains_over_filter_count
  - contains_over_first_not_nil
  - discouraged_object_literal
  - empty_collection_literal
  - empty_string
  - first_where
  - flatmap_over_map_reduce
  - last_where
  - modifier_order
  - redundant_nil_coalescing
  - sorted_first_last
  - toggle_bool
  - unneeded_parentheses_in_closure_argument

line_length:
  warning: 160
  error: 220
  ignores_urls: true
  ignores_function_declarations: true
  ignores_comments: true

function_body_length:
  warning: 100
  error: 150

type_body_length:
  warning: 650
  error: 800

file_length:
  warning: 900
  error: 1200

cyclomatic_complexity:
  warning: 18
  error: 25

identifier_name:
  min_length:
    warning: 1
    error: 1

todo:
  only: [FIXME]

custom_rules:
  # `privacy: .public` puts the value in plain text in the unified log, where
  # any process on the Mac can read it with `log stream`. It is only right for
  # values drawn from a closed set the code already knows — enum labels,
  # counts, durations, exit statuses, version strings. Identifiers, names,
  # paths, URLs and error text belong under `.private`, or
  # `.private(mask: .hash)` when two log lines need to be matched up.
  #
  # The rule allows an interpolation by the shape of its expression. A value
  # that is genuinely closed-set but named outside these shapes should be
  # renamed to fit, or the shape added here.
  log_privacy_public:
    name: "Public log interpolation of an open-ended value"
    included:
      - "ArcBox/.*"
      - "Packages/.*/Sources/.*"
    regex: '\\\((?!(?:[\w.]*\.(?:label|rawValue)\b|[\w.]*[cC]ount\b|[\w.]*[sS]tatus\b|String\(describing: [\w.]*[sS]tatus\)|\w*Version\b|\w*Entitlements\b|[\w.]*Timeout\b|elapsedMs\b|index\b|statusCode\b|operation\b|label\b|type\b|arcboxContextName\b|\w+ \? "[^"]*" : "[^"]*")(?: \?\? "[^"]*")?, privacy: \.public\))[^\\\n]*?, privacy: \.public\)'
    message: "Only closed-set values (enum labels, counts, statuses, versions) may be logged `.public`; identifiers, names, paths, URLs and error text must be `.private` or `.private(mask: .hash)`."
    severity: error
